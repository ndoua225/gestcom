<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mot de passe oublié — GestCom</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/app.css"></head>
<body><main class="center"><section class="card"><div class="logo"><span class="brand-mark">G</span><div><b>GestCom</b><span>Gestion Commerciale</span></div></div><h2>Réinitialiser le mot de passe</h2><p class="sub">Saisissez l’adresse email associée à votre compte.</p><div id="message" class="alert success" role="status" hidden></div><div id="error" class="alert error" role="alert" hidden></div><form id="reset-request"><div class="field"><label for="email">Adresse email</label><input id="email" name="email" type="email" required autocomplete="email"></div><button class="btn primary" type="submit">Créer le lien de réinitialisation</button></form><p class="foot"><a href="login.html">Retour à la connexion</a></p></section></main><script src="js/store.js"></script><script src="js/auth.js"></script><script>
document.getElementById("reset-request").addEventListener("submit",function(e){e.preventDefault();var email=this.elements.email.value,token=Auth.issuePasswordReset(email),msg=document.getElementById("message"),err=document.getElementById("error");err.hidden=true;if(!token){err.textContent="Aucun compte actif associé à cet email.";err.hidden=false;return;}var link=new URL("reinitialiser-mot-de-passe.html?token="+encodeURIComponent(token),location.href).href;msg.innerHTML='Lien généré pour cette démonstration locale : <a href="'+link+'">Ouvrir la réinitialisation</a>';msg.hidden=false;});
</script></body></html>
