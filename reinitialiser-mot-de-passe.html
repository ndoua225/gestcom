<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nouveau mot de passe — GestCom</title><link rel="stylesheet" href="css/style.css?v=20261010a"><link rel="stylesheet" href="css/app.css?v=20261010a"></head>
<body><main class="center"><section class="card"><div class="logo"><span class="brand-mark">G</span><div><b>GestCom</b><span>Gestion Commerciale</span></div></div><h2>Choisissez un nouveau mot de passe</h2><p class="sub">Ce lien de réinitialisation est valable 30 minutes.</p><div id="error" class="alert error" role="alert" hidden></div><form id="reset-form"><div class="field"><label for="password">Nouveau mot de passe</label><input id="password" name="password" type="password" required autocomplete="new-password"></div><div class="field"><label for="confirm">Confirmer le mot de passe</label><input id="confirm" name="confirm" type="password" required autocomplete="new-password"></div><button class="btn primary" type="submit">Enregistrer le mot de passe</button></form></section></main><script src="js/store.js?v=20261010a"></script><script src="js/supabase-config.js?v=20261010a"></script><script src="js/cloud.js?v=20261010a"></script><script src="js/auth.js?v=20261010a"></script><script>
(function(){var token=new URLSearchParams(location.search).get("token"),form=document.getElementById("reset-form"),box=document.getElementById("error");if(!DB.all("tokens").some(function(x){return x.token===token&&x.kind==="reset";})){box.textContent="Ce lien est invalide ou a expiré.";box.hidden=false;form.hidden=true;return;}form.addEventListener("submit",async function(e){e.preventDefault();var p=this.elements.password.value;if(p.length<8||!/[A-Za-z]/.test(p)||!/[0-9]/.test(p)){box.textContent="Utilisez au moins 8 caractères avec des lettres et des chiffres.";box.hidden=false;return;}if(p!==this.elements.confirm.value){box.textContent="Les mots de passe ne correspondent pas.";box.hidden=false;return;}try{await Auth.resetPassword(token,p);sessionStorage.setItem("gestcom_flash","Mot de passe réinitialisé. Vous pouvez vous connecter.");location.replace("login.html");}catch(err){box.textContent=err.message;box.hidden=false;}});})();
</script></body></html>
