<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activer votre compte — GestCom</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/app.css"></head>
<body><main class="center"><section class="card"><div class="logo"><span class="brand-mark">G</span><div><b>GestCom</b><span>Gestion Commerciale</span></div></div><h2>Activez votre compte</h2><p class="sub">Vérifiez vos informations et choisissez un mot de passe personnel.</p><div id="message" class="alert error" role="alert" hidden></div><form id="activation-form"><div class="field"><label for="password">Nouveau mot de passe</label><input id="password" name="password" type="password" required autocomplete="new-password" minlength="8"></div><div class="field"><label for="confirm">Confirmer le mot de passe</label><input id="confirm" name="confirm" type="password" required autocomplete="new-password"></div><button class="btn primary" type="submit">Activer mon compte</button></form><p class="foot">GestCom v1.0</p></section></main><script src="js/store.js"></script><script src="js/auth.js"></script><script src="js/activation.js"></script></body></html>
